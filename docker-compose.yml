services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://cloudguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudguard
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - SENSOR_API_KEY=${CLOUDGUARD_SENSOR_API_KEY:?Set CLOUDGUARD_SENSOR_API_KEY}
      - ADMIN_API_KEY=${CLOUDGUARD_ADMIN_API_KEY:?Set CLOUDGUARD_ADMIN_API_KEY}
      - ANALYST_API_KEY=${CLOUDGUARD_ANALYST_API_KEY:-}
      - VIEWER_API_KEY=${CLOUDGUARD_VIEWER_API_KEY:-}
      - AUTOMATED_RESPONSE_ENABLED=false
      - DEMO_MODE_ENABLED=${DEMO_MODE_ENABLED:-false}
      - KNOWN_DESTINATIONS=${KNOWN_DESTINATIONS:-}
      - MODEL_PATH=/app/model-store/isolation_forest.joblib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/model-store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000/api
      - CLOUDGUARD_ADMIN_API_KEY=${CLOUDGUARD_ADMIN_API_KEY:?Set CLOUDGUARD_ADMIN_API_KEY}
      - CLOUDGUARD_ANALYST_API_KEY=${CLOUDGUARD_ANALYST_API_KEY:-}
      - CLOUDGUARD_VIEWER_API_KEY=${CLOUDGUARD_VIEWER_API_KEY:-}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      - DASHBOARD_ANALYST_USERNAME=${DASHBOARD_ANALYST_USERNAME:-}
      - DASHBOARD_ANALYST_PASSWORD=${DASHBOARD_ANALYST_PASSWORD:-}
      - DASHBOARD_VIEWER_USERNAME=${DASHBOARD_VIEWER_USERNAME:-}
      - DASHBOARD_VIEWER_PASSWORD=${DASHBOARD_VIEWER_PASSWORD:-}
      - DASHBOARD_PUBLIC_ORIGIN=${DASHBOARD_PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cloudguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  model_data:
