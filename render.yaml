# Review plan costs and secrets before creating this Blueprint.
# The backend is private; only the dashboard and two sensor ingest routes are public.
databases:
  - name: cloudguard-db
    databaseName: cloudguard
    user: cloudguard
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: pserv
    name: cloudguard-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DEMO_MODE_ENABLED
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: cloudguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SENSOR_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MODEL_PATH
        value: /app/model-store/isolation_forest.joblib
    disk:
      name: model-data
      mountPath: /app/model-store
      sizeGB: 1

  - type: web
    name: cloudguard-dashboard
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_HOSTPORT
        fromService:
          name: cloudguard-api
          type: pserv
          property: hostport
      - key: CLOUDGUARD_ADMIN_API_KEY
        fromService:
          name: cloudguard-api
          type: pserv
          envVarKey: ADMIN_API_KEY
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
